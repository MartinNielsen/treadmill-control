<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Treadmill Control - FTMS Bluetooth Controller</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    
    <!-- Theme color for browser chrome -->
    <meta name="theme-color" content="#667eea">
    
    <!-- iOS PWA meta tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Treadmill">
    
    <!-- App icons -->
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    
    <!-- Prevent phone number detection -->
    <meta name="format-detection" content="telephone=no">
    
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 2rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-sizing: border-box;
        }
        .container {
            max-width: 600px;
            width: 100%;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }
        h1 {
            font-size: 2.5rem;
            margin: 0 0 0.5rem 0;
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }
        .subtitle {
            text-align: center;
            font-size: 1rem;
            margin-bottom: 2rem;
            opacity: 0.8;
        }
        .row {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .stat-label {
            font-size: 0.9rem;
            opacity: 0.7;
            margin-bottom: 0.5rem;
        }
        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 0.25rem;
        }
        .stat-unit {
            font-size: 1rem;
            opacity: 0.7;
        }
        button {
            padding: 0.8rem 1.2rem;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.1);
            color: white;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            backdrop-filter: blur(4px);
        }
        button:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .status-badge {
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 0.8rem;
            font-weight: 600;
        }
        .status-ok {
            background: rgba(5, 150, 105, 0.3);
            border-color: rgba(5, 150, 105, 0.5);
        }
        .status-warn {
            background: rgba(180, 83, 9, 0.3);
            border-color: rgba(180, 83, 9, 0.5);
        }
        .status-error {
            background: rgba(185, 28, 28, 0.3);
            border-color: rgba(185, 28, 28, 0.5);
        }
        .controls {
            display: flex;
            gap: 1rem;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
        }
        .speed-controls {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }
        .target-display {
            margin-left: 1rem;
            font-size: 0.9rem;
            opacity: 0.8;
        }
        .log {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            padding: 1rem;
            font-family: 'Courier New', monospace;
            font-size: 0.8rem;
            height: 150px;
            overflow-y: auto;
            white-space: pre-wrap;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .notes {
            margin-top: 1.5rem;
            font-size: 0.9rem;
            opacity: 0.8;
        }
        .notes ul {
            padding-left: 1.2rem;
        }
        .notes li {
            margin-bottom: 0.5rem;
        }
        .mono {
            font-family: 'Courier New', monospace;
            background: rgba(255, 255, 255, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Treadmill Control</h1>
        <!-- <p class="subtitle">Connect to a Bluetooth treadmill that implements the Fitness Machine Service (FTMS, UUID <span class="mono">0x1826</span>). You can Start/Stop the belt and adjust speed ±0.5 km/h.</p> -->
        
        <div class="row">
            <button id="btnConnect">🔗 Connect</button>
            <button id="btnDisconnect" hidden>🔌 Disconnect</button>
            <span id="status" class="status-badge">idle</span>
        </div>

        <div class="grid">
            <div class="stat-card">
                <div class="stat-label">Current Speed</div>
                <div class="stat-value">
                    <span id="speed">0.0</span> 
                    <span class="stat-unit">km/h</span>
                </div>
                <div class="stat-label">Device: <span id="deviceName">—</span></div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Target Speed</div>
                <div class="stat-value">
                    <span id="target">0.0</span> 
                    <span class="stat-unit">km/h</span>
                </div>
                <div class="speed-controls" style="margin-top: 1rem; justify-content: center; display: flex; gap: 0.5rem;">
                    <button id="btnMinus">➖ −0.5</button>
                    <button id="btnPlus">➕ +0.5</button>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Allowed Range</div>
                <div class="stat-value" style="font-size: 1.5rem;">
                    <span id="range">—</span>
                </div>
                <div class="stat-label">Step: <span id="step">—</span></div>
            </div>
        </div>

        <div class="controls">
            <button id="btnStart" disabled>▶️ Start</button>
            <button id="btnStop" disabled>⏸ Stop</button>
        </div>

        <div class="log" id="log"></div>

    </div>

    <script>
    (async () => {
      // ======= Assigned Numbers (16-bit UUIDs) =======
      const FTMS_SERVICE                = 0x1826; // Fitness Machine Service
      const CH_FITNESS_MACHINE_FEATURE  = 0x2ACC; // bitfields for features
      const CH_TREADMILL_DATA           = 0x2ACD; // notifications with speed, etc.
      const CH_SUPPORTED_SPEED_RANGE    = 0x2AD4; // min, max, increment (0.01 km/h)
      const CH_FITNESS_MACHINE_CONTROL  = 0x2AD9; // write + indicate responses

      // Fitness Machine Control Point opcodes (per spec)
      const OP_REQUEST_CONTROL = 0x00;
      const OP_RESET           = 0x01;
      const OP_SET_TARGET_SPEED= 0x02; // parameter: uint16 of 0.01 km/h
      const OP_START_OR_RESUME = 0x07;
      const OP_STOP_OR_PAUSE   = 0x08;
      const OP_RESPONSE_CODE   = 0x80;
      const RESULT_SUCCESS     = 0x01;
      const CONTROL_POINT_TIMEOUT_MS = 5000;
      const CONTROL_POINT_RESULT_NAMES = {
        0x01: 'Success',
        0x02: 'Op Code Not Supported',
        0x03: 'Invalid Parameter',
        0x04: 'Operation Failed',
        0x05: 'Control Not Permitted'
      };

      const ui = (id) => document.getElementById(id);

      const log = (m, level="") => {
        console.log(`[LOG] ${level.toUpperCase()}: ${m}`);
        const el = ui('log');
        el.textContent += m + "\n";
        el.scrollTop = el.scrollHeight;
        ui('status').textContent = level || 'connected';
        ui('status').className = 'status-badge ' + (level === 'error' ? 'status-error' : level === 'warn' ? 'status-warn' : 'status-ok');
      };

      let device, server, ftms;
      let chCtrl, chData, chSpeedRange;
      let targetKph = 0.0; // our local target speed in km/h
      let minKph = 0, maxKph = 20, stepKph = 0.1; // defaults until we read Supported Speed Range
      let currentSpeedKph = 0.0;
      let rampUpTimeout;
      let controlPointPending = null;
      let controlPointQueue = Promise.resolve();

      // Load target speed from localStorage
      let savedTargetSpeed = localStorage.getItem('targetSpeed');
      if (savedTargetSpeed) {
        targetKph = parseFloat(savedTargetSpeed);
      }
      updateTargetDisplay();

      function updateTargetDisplay() {
        console.log('updateTargetDisplay called');
        ui('target').textContent = targetKph.toFixed(1);
      }

      function clampTarget() {
        console.log(`clampTarget called. Initial target: ${targetKph} km/h`);
        targetKph = Math.max(minKph, Math.min(maxKph, targetKph));
        // snap to step increment
        const steps = Math.round((targetKph - minKph) / stepKph);
        targetKph = +(minKph + steps * stepKph).toFixed(1);
        console.log(`Clamped and snapped target: ${targetKph} km/h`);
        updateTargetDisplay();
      }

      async function connect() {
        console.log('connect function started');
        setControlsEnabled(false);
        if (!('bluetooth' in navigator)) {
          console.error('Web Bluetooth not supported.');
          alert('Web Bluetooth not supported in this browser. Try Chrome/Edge on desktop or Android, over HTTPS.');
          return;
        }

        log('Requesting treadmill with FTMS (0x1826)…');
        console.log('Requesting Bluetooth device...');
        device = await navigator.bluetooth.requestDevice({
          filters: [
            // Filter by FTMS service; the chooser should only show FTMS devices (e.g., treadmills)
            { services: [FTMS_SERVICE] },
            // Optional: narrow further by advertised name prefix if your brand is known
            // { namePrefix: 'NoblePro' },
          ],
          optionalServices: [FTMS_SERVICE]
        });
        console.log('Device selected:', device);

        ui('deviceName').textContent = device.name || '(unnamed)';

        device.addEventListener('gattserverdisconnected', onDisconnected);

        console.log('Connecting to GATT server...');
        server = await device.gatt.connect();
        console.log('GATT server connected:', server);
        console.log('Getting FTMS primary service...');
        ftms = await server.getPrimaryService(FTMS_SERVICE);
        console.log('FTMS service obtained:', ftms);

        // Characteristics we use
        console.log('Getting characteristics...');
        chCtrl       = await ftms.getCharacteristic(CH_FITNESS_MACHINE_CONTROL);
        console.log('Fitness Machine Control characteristic:', chCtrl);
        chData       = await ftms.getCharacteristic(CH_TREADMILL_DATA);
        console.log('Treadmill Data characteristic:', chData);
        chSpeedRange = await ftms.getCharacteristic(CH_SUPPORTED_SPEED_RANGE).catch((e) => {
            console.warn('Supported Speed Range characteristic not found:', e);
            return null;
        });
        console.log('Supported Speed Range characteristic:', chSpeedRange);

        const controlProperties = chCtrl.properties || {};
        if (!controlProperties.indicate) {
          throw new Error('Fitness Machine Control Point does not support indications.');
        }
        if (!controlProperties.write || typeof chCtrl.writeValueWithResponse !== 'function') {
          throw new Error('Fitness Machine Control Point does not support write-with-response.');
        }

        // Listen for control point responses (indications)
        await chCtrl.startNotifications();
        chCtrl.addEventListener('characteristicvaluechanged', onControlPointIndication);

        // Request control (mandatory before sending control commands on many machines)
        await writeControl(OP_REQUEST_CONTROL);

        // Subscribe to treadmill data for live speed
        console.log('Starting notifications for Treadmill Data...');
        await chData.startNotifications();
        chData.addEventListener('characteristicvaluechanged', onTreadmillData);
        console.log('Treadmill Data notifications started.');

        // Read supported speed range if available
        if (chSpeedRange) {
          console.log('Reading Supported Speed Range...');
          const dv = await chSpeedRange.readValue();
          console.log('Supported Speed Range raw value:', dv);
          // All are uint16 little-endian in 0.01 km/h
          minKph  = dv.getUint16(0, true) / 100;
          maxKph  = dv.getUint16(2, true) / 100;
          stepKph = dv.getUint16(4, true) / 100;
          console.log(`Speed range parsed: min=${minKph}, max=${maxKph}, step=${stepKph}`);
          ui('range').textContent = `${minKph.toFixed(1)}–${maxKph.toFixed(1)} km/h`;
          ui('step').textContent  = `${stepKph.toFixed(1)} km/h`;
          targetKph = Math.max(minKph, Math.min(5, maxKph));
          updateTargetDisplay();
        } else {
          console.warn('No Supported Speed Range characteristic available.');
          ui('range').textContent = 'unknown';
          ui('step').textContent  = '—';
        }

        setControlsEnabled(true);
        log('Connected successfully');
        console.log('Connection process complete.');
      }

      function disconnect() {
        if (device && device.gatt.connected) {
          log('Disconnecting...');
          device.gatt.disconnect();
        }
      }

      function rejectPendingControlPoint(error) {
        if (!controlPointPending) return;
        const pending = controlPointPending;
        controlPointPending = null;
        clearTimeout(pending.timeoutId);
        pending.reject(error);
      }

      function onDisconnected() {
        console.warn('GATT server disconnected.');
        rejectPendingControlPoint(new Error('Fitness Machine Control Point disconnected before a response.'));
        log('Disconnected');
        setControlsEnabled(false);
        ui('status').textContent = 'disconnected';
        ui('status').className = 'status-badge status-error';
      }

      function setControlsEnabled(enabled) {
        console.log(`Setting controls enabled state to: ${enabled}`);
                ui('btnStart').disabled = !enabled;
                ui('btnStop').disabled  = !enabled;
        ui('btnConnect').hidden = enabled;
        ui('btnDisconnect').hidden = !enabled;
      }

      function onTreadmillData(event) {
        const dv = event.target.value; // DataView
        if (dv.byteLength < 2) return;

        const flags = dv.getUint16(0, true);
        const moreData = (flags & 0x0001) !== 0;

        // FTMS flag bit 0 is "More Data": when clear, instantaneous speed is
        // present immediately after the flags; when set, it is omitted.
        if (moreData || dv.byteLength < 4) return;

        const speedKph = dv.getUint16(2, true) / 100;

        // Ignore implausible values without replacing the last valid live reading.
        if (speedKph >= 100) return;

        ui('speed').textContent = speedKph.toFixed(1);
        currentSpeedKph = speedKph;
      }

      function onControlPointIndication(event) {
        const dv = event.target.value;
        if (dv.byteLength < 3) {
          const error = new Error('Control Point response is too short.');
          console.error(error.message);
          log(error.message, 'error');
          rejectPendingControlPoint(error);
          return;
        }

        // Response format: Op Code (0x80), Request Op Code, Result Code, [optional parameter]
        const op   = dv.getUint8(0);
        const req  = dv.getUint8(1);
        const rc   = dv.getUint8(2);
        const resultName = CONTROL_POINT_RESULT_NAMES[rc] || `Unknown (0x${rc.toString(16)})`;

        const pending = controlPointPending;
        if (op !== OP_RESPONSE_CODE) {
          log(`Unexpected Control Point response opcode 0x${op.toString(16)}`, 'error');
          return;
        }
        if (!pending) {
          log(`Unexpected Control Point response for opcode 0x${req.toString(16)}`, 'warn');
          return;
        }
        if (req !== pending.opcode) {
          log(`Control Point response opcode mismatch: expected 0x${pending.opcode.toString(16)}, received 0x${req.toString(16)}`, 'error');
          return;
        }

        controlPointPending = null;
        clearTimeout(pending.timeoutId);
        if (rc !== RESULT_SUCCESS) {
          const error = new Error(`Control Point opcode 0x${req.toString(16)} rejected: ${resultName} (0x${rc.toString(16)})`);
          log(error.message, 'error');
          pending.reject(error);
          return;
        }

        log(`Control Point opcode 0x${req.toString(16)} confirmed: ${resultName}`);
        pending.resolve({ requestOpcode: req, resultCode: rc });
      }

      function waitForControlPointResponse(opcode) {
        if (controlPointPending) {
          throw new Error('Another Control Point transaction is already in progress.');
        }

        return new Promise((resolve, reject) => {
          const timeoutId = setTimeout(() => {
            if (controlPointPending && controlPointPending.opcode === opcode) {
              controlPointPending = null;
              reject(new Error(`Timed out waiting for Control Point response to opcode 0x${opcode.toString(16)}.`));
            }
          }, CONTROL_POINT_TIMEOUT_MS);
          controlPointPending = { opcode, resolve, reject, timeoutId };
        });
      }

      async function sendControlPointCommand(opcode, parameter = null) {
        if (!chCtrl) {
          throw new Error('Fitness Machine Control Point is not connected.');
        }

        // Control Point writes are variable length. Numeric parameters are
        // uint16 little-endian; byte arrays support one-byte Stop/Pause data.
        let payload;
        if (parameter instanceof Uint8Array) {
          payload = new Uint8Array(1 + parameter.length);
          payload[0] = opcode;
          payload.set(parameter, 1);
        } else if (typeof parameter === 'number') {
          payload = new Uint8Array(3);
          payload[0] = opcode;
          payload[1] = parameter & 0xff;
          payload[2] = (parameter >> 8) & 0xff;
        } else {
          payload = new Uint8Array([opcode]);
        }

        const responsePromise = waitForControlPointResponse(opcode);
        try {
          await chCtrl.writeValueWithResponse(payload);
          return await responsePromise;
        } catch (error) {
          if (controlPointPending && controlPointPending.opcode === opcode) {
            rejectPendingControlPoint(error);
          }
          throw error;
        }
      }

      function writeControl(opcode, parameter = null) {
        const transaction = controlPointQueue.then(() => sendControlPointCommand(opcode, parameter));
        controlPointQueue = transaction.catch(() => {});
        return transaction;
      }

      async function start() {
        const RAMP_UP_DELAY_MS = 5000; // 5 seconds

        console.log('start function called');
        try {
            await writeControl(OP_START_OR_RESUME);
            log('Start command confirmed');
    
            const initialSpeed = 1.0;
            const value = Math.round(initialSpeed * 100);
            await writeControl(OP_SET_TARGET_SPEED, value);
            log(`Initial speed target confirmed at 1.0 km/h. Waiting ${RAMP_UP_DELAY_MS / 1000}s for ramp-up...`);

            // Wait for the treadmill to ramp up before setting the final target speed
            rampUpTimeout = setTimeout(async () => {
                try {
                    const targetValue = Math.round(targetKph * 100);
                    console.log(`Ramp-up delay complete. Setting target speed to ${targetKph.toFixed(1)} km/h`);
                    await writeControl(OP_SET_TARGET_SPEED, targetValue);
                    log(`Target speed confirmed at ${targetKph.toFixed(1)} km/h`);
                } catch (e) {
                    console.error('Error setting target speed after delay:', e);
                    setControlsEnabled(false);
                    log(e.message, 'error');
                }
            }, RAMP_UP_DELAY_MS);

        } catch (e) {
            console.error('Failed to send start commands:', e);
            setControlsEnabled(false);
            log(e.message, 'error');
        }
      }

      async function stop() {
        console.log('stop function called');
        clearTimeout(rampUpTimeout); // Clear the ramp-up timeout
        await writeControl(OP_STOP_OR_PAUSE, new Uint8Array([0x01]));
        log('Stop command confirmed');
      }

      function adjustTargetSpeed(delta) {
        console.log(`adjustTargetSpeed function called with delta: ${delta}`);
        targetKph = +(targetKph + delta).toFixed(1);
        clampTarget();
        localStorage.setItem('targetSpeed', targetKph);
      }

      // ===== wire up UI =====
      ui('btnConnect').addEventListener('click', () => {
        console.log('Connect button clicked');
        connect().catch(e => {
            console.error('Connection failed:', e);
            setControlsEnabled(false);
            log(e.message, 'error');
        });
      });
      ui('btnDisconnect').addEventListener('click', () => {
        console.log('Disconnect button clicked');
        disconnect();
      });
      ui('btnStart').addEventListener('click', () => {
        console.log('Start button clicked');
        start().catch(e => {
            console.error('Start command failed:', e);
            setControlsEnabled(false);
            log(e.message, 'error');
        });
      });
      ui('btnStop').addEventListener('click',  () => {
        console.log('Stop button clicked');
        stop().catch(e => {
            console.error('Stop command failed:', e);
            setControlsEnabled(false);
            log(e.message, 'error');
        });
      });
      ui('btnPlus').addEventListener('click',  () => {
        console.log('Plus button clicked');
        adjustTargetSpeed(+0.5);
      });
      ui('btnMinus').addEventListener('click', () => {
        console.log('Minus button clicked');
        adjustTargetSpeed(-0.5);
      });

      // Initialize display
      console.log('Script initialization complete.');
    })();
    </script>
</body>
</html>
