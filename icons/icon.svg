<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <!-- Treadmill icon -->
  <g fill="none" stroke="white" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">
    <!-- Running belt base -->
    <rect x="100" y="280" width="312" height="80" rx="40" fill="rgba(255,255,255,0.2)" stroke="white"/>
    <!-- Control panel/handle bars -->
    <path d="M140 280 L140 160 L180 120 L332 120 L372 160 L372 280" fill="none"/>
    <!-- Speed indicator dots on panel -->
    <circle cx="220" cy="160" r="12" fill="white" stroke="none"/>
    <circle cx="256" cy="160" r="12" fill="rgba(255,255,255,0.6)" stroke="none"/>
    <circle cx="292" cy="160" r="12" fill="rgba(255,255,255,0.3)" stroke="none"/>
    <!-- Running figure simplified -->
    <circle cx="256" cy="220" r="18" fill="white" stroke="none"/>
    <!-- Belt movement lines -->
    <line x1="140" y1="320" x2="180" y2="320" stroke="rgba(255,255,255,0.5)" stroke-width="8"/>
    <line x1="200" y1="320" x2="260" y2="320" stroke="rgba(255,255,255,0.5)" stroke-width="8"/>
    <line x1="280" y1="320" x2="340" y2="320" stroke="rgba(255,255,255,0.5)" stroke-width="8"/>
    <line x1="360" y1="320" x2="400" y2="320" stroke="rgba(255,255,255,0.5)" stroke-width="8"/>
  </g>
</svg>
